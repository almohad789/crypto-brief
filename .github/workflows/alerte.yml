name: Alertes Market Cap

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install requests

      - name: Verifier les market caps
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python alerte_crypto.py

      - name: Sauvegarder l'etat des alertes
        run: |
          git config user.name "alerte-bot"
          git config user.email "alerte-bot@users.noreply.github.com"
          git pull --rebase || true
          git add alerte_state.json || true
          git diff --cached --quiet || git commit -m "maj etat alertes"
          git push || true
          
