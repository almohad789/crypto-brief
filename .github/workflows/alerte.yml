name: Alertes Market Cap

on:
  schedule:
    # Toutes les 30 min, aux minutes 13 et 43 : les minutes 0 et 30
    # sont surchargées chez GitHub et souvent sautées.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = comme un cron planifie (creneau + dedup), test = poste immediatement"
        required: false
        default: "test"

permissions:
  contents: write

concurrency:
  group: crypto-brief-repo
  cancel-in-progress: false

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install requests

      - name: Verifier les market caps
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'auto' && '1' || '' }}
          # Décommente pour des alertes plus fréquentes (défaut : 10)
          # SEUIL_ALERTE: "5"
        run: python alerte_crypto.py

      - name: Sauvegarder l'etat des alertes
        run: |
          git config user.name "alerte-bot"
          git config user.email "alerte-bot@users.noreply.github.com"
          git add alerte_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "maj etat alertes"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
