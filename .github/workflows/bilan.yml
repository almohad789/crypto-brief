name: Bilans crypto Discord

on:
  schedule:
    # Fenêtre du script : 12h-17h59 Paris. GitHub retardant beaucoup,
    # on tente toutes les heures sur la plage correspondante en UTC
    # (été UTC+2 / hiver UTC+1). bilan_state.json garantit zéro doublon.
    - cron: "13 10-16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-brief-repo
  cancel-in-progress: false

jobs:
  bilan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install requests

      - name: Envoyer les bilans
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python bilan_crypto.py

      - name: Sauvegarder l'etat des bilans
        run: |
          git config user.name "bilan-bot"
          git config user.email "bilan-bot@users.noreply.github.com"
          git add bilan_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "maj etat bilans"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
