name: Bilans crypto Discord
 
on:
  schedule:
    # 12h Paris, été (UTC+2) et hiver (UTC+1). Le script vérifie l'heure
    # de Paris et ce qui est dû (lundi, 1er du mois, trimestre, 1er janvier).
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
 
jobs:
  bilan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Installer les dependances
        run: pip install requests
 
      - name: Envoyer les bilans
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python bilan_crypto.py
 
