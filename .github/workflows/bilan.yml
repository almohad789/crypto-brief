name: Bilans crypto Discord

on:
  schedule:
    # Le script gère échéances, rattrapage sur plusieurs jours et
    # anti-doublon (bilan_state.json) : ces crons ne sont que des occasions
    # de tenter. Plage large 12h13-22h13 Paris (été) pour absorber les
    # retards massifs de GitHub. cron-job.org à 12h00 reste le déclencheur
    # principal recommandé.
    - cron: "13 10-20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = comme un cron planifie (creneau + dedup), test = poste immediatement"
        required: false
        default: "test"

permissions:
  contents: write

concurrency:
  group: crypto-brief-repo
  cancel-in-progress: false

jobs:
  bilan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install requests

      - name: Envoyer les bilans
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'auto' && '1' || '' }}
        run: python bilan_crypto.py

      - name: Sauvegarder l'etat des bilans
        run: |
          git config user.name "bilan-bot"
          git config user.email "bilan-bot@users.noreply.github.com"
          git add bilan_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "maj etat bilans"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
