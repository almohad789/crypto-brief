name: Brief crypto Discord
 
on:
  schedule:
    # GitHub retarde souvent les crons de plusieurs heures (observé : 6h !).
    # Stratégie : on tente toutes les 30 min pendant toute la fenêtre
    # matin (6h-11h59 Paris) et soir (20h-23h59 Paris), été comme hiver.
    # Le script poste UNE seule fois par créneau (dédup previous_prices.json),
    # au premier run qui atterrit dans la fenêtre. Tous les autres s'arrêtent
    # en 2 secondes sans rien poster.
    - cron: "13,43 4-10 * * *"    # couvre le matin (UTC 4h-10h43)
    - cron: "13,43 18-22 * * *"   # couvre le soir  (UTC 18h-22h43)
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: crypto-brief-repo
  cancel-in-progress: false
 
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Installer les dependances
        run: pip install requests
 
      - name: Envoyer le brief
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python crypto_brief_gh.py
 
      - name: Sauvegarder les prix pour le prochain brief
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add previous_prices.json || true
          if ! git diff --cached --quiet; then
            git commit -m "maj prix brief"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
 
